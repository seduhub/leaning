<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sara247 - Download App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #f0f4f9 0%, #e2eaf5 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 320px;
      padding: 40px 24px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12),
                  0 4px 12px rgba(0, 0, 0, 0.05);
    }

    .logo-container {
      width: 110px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .details {
      font-size: 16px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 28px;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(180deg, #ff1a1a 0%, #d80000 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #b30000;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.5);
    }

    .download-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <!-- Replace 'logo.png' with your image file path -->
      <img src="logo.png" alt="Sara247 Logo">
    </div>

    <h1 class="title">Sara247</h1>
    <p class="details">Min. Deposit -&gt; 50/-</p>

    <a href="https://seduhub.github.io/leaning/s247.apk" class="download-btn" download>
      Download App
    </a>
  </div>

</body>
</html>
